name: Update Module Output JSON

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-module-output
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # GitHub automatically provides this token; sufficient for public repo reads.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go mod download
        run: go mod download

      - name: Generate module output (fetch + process)
        run: |
          set -euo pipefail
          echo "Running module-schema fetch & process..."
          go run ./module-schema -fetch
          test -f output.json || { echo "output.json not generated" >&2; exit 1; }
          mkdir -p provider-schema/processors
          mv -f output.json provider-schema/processors/module_output.json

      - name: Run targeted tests (module-schema)
        run: go test ./module-schema/... -count=1 -timeout=20m

      - name: Verify JSON size & basic structure
        run: |
          set -euo pipefail
          jq 'length' provider-schema/processors/module_output.json > /dev/null
          echo "Entries: $(jq 'length' provider-schema/processors/module_output.json)"
          head -c 200 provider-schema/processors/module_output.json || true

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git checkout -b chore/update-module-output
            git commit -m "chore: update module_output.json"
            git push --set-upstream origin chore/update-module-output
            echo "Changes committed and pushed to chore/update-module-output branch"
          fi
